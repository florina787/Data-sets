services:
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /app/data/processed/analytics.duckdb
    volumes:
      - cic-data:/app/data/processed
      - cic-index:/app/data/indexes
    ports: ["8000:8000"]
  frontend:
    build: { context: frontend }
    depends_on:
      backend: { condition: service_healthy }
    ports: ["8080:80"]

volumes:
  cic-data:
  cic-index:
