[project]
name = "florome"
version = "0.1.0"
description = "Florome: enterprise RCA, governed remediation and MCP integration platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "mcp>=2.3,<3",
    "anyio>=4.4",
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.25",
    "tree-sitter-javascript>=0.25",
    "bandit>=1.8",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["florome*"]

[tool.setuptools.package-data]
florome = ["shield/rules/*.yml", "shield/policy/*.rego", "shield/range/targets/**/*", "shield/range/targets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
