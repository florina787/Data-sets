<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d18"/><stop offset="1" stop-color="#14164A"/></linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C7CCFF" stop-opacity=".9"/><stop offset="1" stop-color="#5B63E6" stop-opacity=".15"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E8C26A"/><stop offset="1" stop-color="#C6F36B"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <g transform="translate(905 285)">
    <ellipse cx="0" cy="0" rx="250" ry="34" fill="#5B63E6" opacity=".25"/>
    <path d="M-210 0 A210 190 0 0 1 210 0 Z" fill="url(#dome)" stroke="#A3AAFB" stroke-width="2"/>
    <path d="M-140 0 A140 128 0 0 1 140 0" fill="none" stroke="#C7CCFF" stroke-opacity=".5" stroke-width="1.5"/>
    <path d="M-70 0 A70 64 0 0 1 70 0" fill="none" stroke="#E8C26A" stroke-width="2"/>
    <g fill="#ffffff">
      <rect x="-170" y="-34" width="34" height="34" rx="6" opacity=".85"/><rect x="-118" y="-58" width="34" height="58" rx="6" opacity=".7"/>
      <rect x="-60" y="-26" width="34" height="26" rx="6" opacity=".9"/><rect x="30" y="-46" width="34" height="46" rx="6" opacity=".75"/>
      <rect x="86" y="-30" width="34" height="30" rx="6" opacity=".85"/><rect x="134" y="-18" width="34" height="18" rx="6" opacity=".65"/>
    </g>
    <circle cx="0" cy="-118" r="6" fill="#C6F36B"/><circle cx="-96" cy="-150" r="4" fill="#E8C26A"/><circle cx="104" cy="-140" r="4" fill="#7ad7c9"/>
  </g>
  <text x="64" y="112" font-size="74" font-weight="800" fill="#ffffff" letter-spacing="-2">florome</text>
  <text x="66" y="160" font-size="26" fill="#C7CCFF">The intelligence dome over your enterprise</text>
  <text x="66" y="214" font-size="18" fill="#ffffffb0">Finds why things broke · fixes them with permission · proves it worked</text>
  <text x="66" y="244" font-size="18" fill="#ffffffb0">Finds security holes · proves they are real · writes and retests the fix</text>
  <rect x="66" y="276" width="330" height="40" rx="20" fill="url(#gold)"/>
  <text x="231" y="302" font-size="16" font-weight="700" fill="#0b0d18" text-anchor="middle">One Intelligence. Every Cloud.</text>
