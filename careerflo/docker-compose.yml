# Single-VM deployment: API + Qwen (Ollama) + static frontend. Database = Supabase (DATABASE_URL in .env).
# Local development without Supabase: leave DATABASE_URL unset to use SQLite inside the api container.
services:
  ollama:
    image: ollama/ollama:0.40.14
    volumes: ["ollama:/root/.ollama"]
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "24h"
    restart: unless-stopped
    # Not published to the host: only the api container can reach it.
  ollama-pull:
    image: ollama/ollama:0.40.14
    depends_on: [ollama]
    environment: { OLLAMA_HOST: "ollama:11434" }
    entrypoint: ["sh", "-c", "sleep 5 && ollama pull ${LLM_MODEL:-qwen3:1.7b}"]
    restart: "no"
  api:
    build: ./backend
    env_file: .env
    environment:
      LLM_PROVIDER: ollama
      LLM_BASE_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen3:1.7b}
    depends_on: [ollama]
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    ports: ["8080:80"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  ollama: {}
