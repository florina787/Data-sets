[project]
name = "careerflo-backend"
version = "0.1.0"
description = "Career_flo AI - multi-tenant career intelligence backend (FastAPI + LangGraph + MCP + Qwen)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4,<3",
  "email-validator>=2.1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "langgraph>=1.0,<2",
  "mcp>=1.9,<2",
  "stripe>=11,<20",
  "pyjwt[crypto]>=2.9,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "fpdf2>=2.8,<3",
  "psutil>=6,<8",
]

[dependency-groups]
deploy = [
    "huggingface-hub>=0.30",
]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 120

[tool.uv]
package = false
