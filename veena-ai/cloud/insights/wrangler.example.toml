# VEENA Insights — Cloudflare Worker + D1 (Workers Free plan). NOT DEPLOYED.
# Copy to wrangler.toml, fill in database_id after `wrangler d1 create veena-insights`.
# Secrets are never written here: `wrangler secret put DASHBOARD_TOKEN` (at least 32 random characters).
name = "veena-insights"
main = "src/worker.js"
compatibility_date = "2026-01-01"
workers_dev = true

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[vars]
ALLOWED_ORIGINS = "https://florina787.github.io"
GITHUB_REPO = "florina787/Data-sets"
RETENTION_DAYS = "395"       # desktop events kept ~13 months, then deleted by the daily job
WEB_RETENTION_DAYS = "395"   # website counters

[[d1_databases]]
binding = "DB"
database_name = "veena-insights"
database_id = "REPLACE_AFTER_wrangler_d1_create"

[triggers]
crons = ["17 3 * * *"]       # daily 03:17 UTC: retention purge + GitHub download snapshot (1 of 5 free cron triggers)
