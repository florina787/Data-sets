<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>VEENA film</title>
<style>
@font-face { font-family: "Inter"; src: url("../../fonts/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Serif"; src: url("../../fonts/instrument-serif-latin-400-italic.woff2") format("woff2"); font-style: italic; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1280px; height: 720px; overflow: hidden; background: #17110f; font-family: Inter, sans-serif; }
#stage { position: absolute; inset: 0; overflow: hidden; }
#par { position: absolute; top: 0; left: 0; height: 720px; display: flex; }
#par i { display: block; position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; }
#track { position: absolute; top: 0; left: 0; height: 720px; display: flex; will-change: transform; }
.panel { position: relative; width: 1280px; height: 720px; flex: none; }
.panel.light { background: linear-gradient(90deg, rgba(251,247,240,.93), rgba(239,227,209,.55)); color: #201a17; }
.panel.dark { background: linear-gradient(90deg, rgba(14,10,9,.92) 0%, rgba(23,17,15,.6) 45%, rgba(23,17,15,.25) 100%); color: #f7f3ec; }
.spot { position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background: radial-gradient(ellipse 600px 400px at 66% 51%, transparent 72%, rgba(8,6,5,.4) 100%); opacity: 0; }
#flow { position: absolute; top: -40px; left: 0; height: 800px; width: 12000px;
  background: repeating-linear-gradient(115deg, transparent 0 79px, rgba(215,192,161,.10) 79px 80px),
    linear-gradient(115deg, #120d0b, #2a1d17 30%, #17110f 55%, #34251e 80%, #120d0b); background-size: auto, 1600px 100%; }
#par i { mix-blend-mode: screen; }
#grain { position: absolute; inset: 0; z-index: 8; pointer-events: none; opacity: .07;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
#vig { position: absolute; inset: 0; z-index: 7; pointer-events: none; background: radial-gradient(ellipse at 55% 50%, transparent 55%, rgba(0,0,0,.55) 100%); }
.label { display: flex; align-items: center; gap: 12px; font-size: 13px; letter-spacing: .32em; text-transform: uppercase; color: #c9a27a; font-weight: 600; }
.label::after { content: ""; width: 54px; height: 1px; background: linear-gradient(90deg, #c9a27a, transparent); }
#chip { position: absolute; right: 28px; top: 22px; z-index: 7; display: flex; align-items: center; gap: 12px; padding: 10px 18px 10px 12px;
  border-radius: 999px; background: rgba(23,17,15,.78); color: #f7f3ec; font-size: 17px; font-weight: 550; backdrop-filter: blur(8px); box-shadow: 0 10px 30px rgba(0,0,0,.3); }
#chip small { display: block; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .65; font-weight: 600; }
#chip svg { width: 38px; height: 38px; flex: none; }
#count { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; }
#ring { position: relative; width: 38px; height: 38px; }
#dots { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 10px; z-index: 7; }
#dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(201,162,122,.35); display: block; }
#dots i.on { width: 30px; border-radius: 6px; background: #c9a27a; }
.copy { position: absolute; left: 56px; top: 190px; width: 350px; z-index: 2; }
.num { font-family: Serif; font-style: italic; font-size: 30px; color: #b98a5e; }
.copy h2 { margin-top: 22px !important; font-size: 46px; line-height: 1.02; letter-spacing: -.03em; font-weight: 650; margin-top: 8px; }
.copy h2 em { font-family: Serif; font-weight: 400; color: #b98a5e; font-size: 1.12em; padding: 0 6px;
  background: linear-gradient(transparent 58%, rgba(201,162,122,.45) 58%) no-repeat 0 0 / var(--hl, 0%) 100%; }
.win { transform-origin: 70% 50%; }
.done { position: absolute; right: 18px; top: 40px; padding: 8px 16px; border-radius: 999px; background: #c9a27a; color: #17110f;
  font-weight: 700; font-size: 17px; opacity: 0; box-shadow: 0 10px 24px rgba(0,0,0,.35); }
.copy p { margin-top: 18px; font-size: 19px; line-height: 1.45; opacity: .78; }
.win { position: absolute; right: 40px; top: 74px; width: 820px; z-index: 2; border-radius: 16px; overflow: hidden;
  box-shadow: 0 40px 80px -30px rgba(0,0,0,.6), 0 0 0 1px rgba(215,192,161,.35); background: #1b1513; }
.win .bar { height: 26px; display: flex; gap: 7px; align-items: center; padding-left: 12px; background: #241b17; }
.win .bar b { width: 10px; height: 10px; border-radius: 50%; background: #4a3a31; }
.win video { display: block; width: 820px; height: 512px; object-fit: cover; object-position: top left; }
.center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.center h1 { font-size: 104px; letter-spacing: -.05em; font-weight: 700; line-height: 1; }
.center h1 em { font-family: Serif; font-weight: 400; color: #c9a27a; }
.center p { font-size: 28px; margin-top: 18px; opacity: .85; }
.center .small { font-size: 18px; margin-top: 26px; opacity: .6; letter-spacing: .14em; text-transform: uppercase; }
.pill { display: inline-block; margin-top: 30px; padding: 14px 30px; border-radius: 999px; background: #f7f3ec; color: #17110f; font-weight: 650; font-size: 22px; }
#logo { position: absolute; left: 0; top: 0; width: 120px; height: 120px; will-change: transform; z-index: 5; }
#logo img { width: 120px; height: 120px; display: block; filter: drop-shadow(0 0 22px rgba(215,170,110,.55)) drop-shadow(0 16px 18px rgba(0,0,0,.45)); }
#shadow { position: absolute; width: 110px; height: 18px; border-radius: 50%; background: rgba(0,0,0,.28); filter: blur(6px); z-index: 4; }
#prog { position: absolute; left: 0; bottom: 0; height: 4px; background: #c9a27a; z-index: 6; }
</style>
</head>
<body>
<div id="stage">
  <div id="flow"></div>
  <div id="par"></div>
  <div id="track"></div>
  <div id="shadow"></div>
  <div id="logo"><img id="logoimg" src="../../../apps/desktop/assets/veena-cat.svg" alt="" /></div>
  <div id="prog"></div>
  <div id="vig"></div><div id="grain"></div>
  <div id="chip"><div id="ring"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="rgba(247,243,236,.2)" stroke-width="4"/><circle id="arc" cx="20" cy="20" r="16" fill="none" stroke="#c9a27a" stroke-width="4" stroke-linecap="round" transform="rotate(-90 20 20)" stroke-dasharray="100.5" stroke-dashoffset="100.5"/></svg><span id="count"></span></div><div><small id="chiplabel">Up next</small><span id="chipname"></span></div></div>
  <div id="dots"></div>
</div>
<script>
// Scenes. Each feature plays its real recorded demo (site/media) from start to finished result.
const FEATURES = [
  { name: "Ask anything", clip: "chat", t: "Ask <em>anything.</em>", p: "Type or speak. An open AI model answers on your own computer." },
  { name: "Documents", clip: "docs", t: "Answers with <em>sources.</em>", p: "Add your documents. Every answer cites the exact passage it used." },
  { name: "Screen", clip: "screen", t: "Sees what <em>you share.</em>", p: "Pick one window. VEENA explains what is on it, secrets masked first." },
  { name: "Meetings", clip: "meeting", t: "Meeting <em>notes.</em>", p: "Speech is transcribed locally, then summarised into notes." },
  { name: "Interviews", clip: "interview", t: "Interview <em>practice.</em>", p: "Answer real questions and get scored feedback to improve." },
  { name: "Evidence", clip: "agents", t: "Trust, <em>but verify.</em>", p: "Facts in each answer are checked against what VEENA was given." },
];
const INTRO = 1.6, SLIDE = 0.75, HOLD = 2.9, OUTRO = 2.4;
const SCENES = 1 + FEATURES.length + 1;
const DURATION = INTRO + FEATURES.length * (SLIDE + HOLD) + SLIDE + OUTRO;
window.DURATION = DURATION;

const track = document.getElementById("track"), par = document.getElementById("par");
const panels = [];
function el(html) { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
panels.push(el(`<div class="panel dark"><div class="center"><p class="small">Private · Open source · Free</p><h1>Meet <em>VEENA.</em></h1><p>Your AI. Your computer. Your control.</p></div></div>`));
FEATURES.forEach((f, i) => panels.push(el(`<div class="panel dark">
  <div class="copy"><div class="label">Feature 0${i + 1}</div><h2>${f.t}</h2><p>${f.p}</p></div>
  <div class="spot"></div><div class="win"><div class="bar"><b></b><b></b><b></b></div><video muted playsinline preload="auto" src="../../media/${f.clip}.mp4"></video><span class="done">✓ Done</span></div></div>`)));
panels.push(el(`<div class="panel dark"><div class="center"><h1>VEENA<em>.AI</em></h1><p>Your AI. Your computer. Your control.</p><span class="pill">Download VEENA — Free</span><p class="small">Windows · macOS · Linux</p></div></div>`));
panels.forEach((p) => track.appendChild(p));
// Parallax glow layer (moves at 40% of the track speed).
[["#c9a27a", 140, 520], ["#8a5a36", 900, 120], ["#efe3d1", 1700, 460], ["#c9a27a", 2600, 160], ["#8a5a36", 3500, 520], ["#efe3d1", 4300, 200], ["#c9a27a", 5200, 480]]
  .forEach(([c, x, y]) => { const b = document.createElement("i"); Object.assign(b.style, { background: c, left: x + "px", top: y + "px", width: "520px", height: "520px", opacity: ".32" }); par.appendChild(b); });

const dots = document.getElementById("dots");
FEATURES.forEach(() => dots.appendChild(document.createElement("i")));
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeInOut = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOutBack = (x) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

// Where the logo rests in each scene (stage coordinates of its top-left).
const REST = [ [580, 70], ...FEATURES.map((_, i) => i % 2 ? [92, 548] : [92, 548]), [580, 60] ];

// Timeline helpers: scene k (k>=1) starts with a slide that begins at slideStart(k).
const slideStart = (k) => INTRO + (k - 1) * (SLIDE + HOLD);

function state(t) {
  // Which transition (if any) is running, and progress within it.
  for (let k = 1; k < SCENES; k++) {
    const s = slideStart(k);
    if (t < s) return { scene: k - 1, slide: null, since: t - (k === 1 ? 0 : slideStart(k - 1) + SLIDE) };
    if (t < s + SLIDE) return { scene: k - 1, slide: k, p: (t - s) / SLIDE };
  }
  return { scene: SCENES - 1, slide: null, since: t - (slideStart(SCENES - 1) + SLIDE) };
}

window.render = async function (t) {
  const st = state(t);
  let pos; // track position in "panels"
  if (st.slide) pos = (st.slide - 1) + easeInOut(st.p); else pos = st.scene;
  track.style.transform = `translateX(${-pos * 1280}px)`;
  par.style.transform = `translateX(${-pos * 1280 * 0.4 - t * 40}px)`;
  // The backdrop never stops: a steady drift, plus a push during each slide.
  document.getElementById("flow").style.transform = `translateX(${-(t * 90 + pos * 260) % 800}px)`;

  // "Up next" chip: names the next feature; the ring fills toward the switch, with a 3-2-1 count.
  const nextK = st.slide ? st.slide + 1 : st.scene + 1;          // scene index that comes next
  const chip = document.getElementById("chip");
  if (nextK >= 1 && nextK <= SCENES - 1 && !st.slide) {
    const begin = nextK === 1 ? 0 : slideStart(nextK - 1) + SLIDE, at = slideStart(nextK);
    const q = clamp((t - begin) / (at - begin)), left = at - t;
    chip.style.opacity = 1;
    document.getElementById("chipname").textContent = nextK <= FEATURES.length ? FEATURES[nextK - 1].name : "Get VEENA";
    document.getElementById("chiplabel").textContent = nextK === 1 ? "First up" : "Up next";
    document.getElementById("arc").setAttribute("stroke-dashoffset", (100.5 * (1 - q)).toFixed(1));
    document.getElementById("count").textContent = left <= 3 ? Math.ceil(left) : "";
  } else chip.style.opacity = 0;
  [...dots.children].forEach((d, i) => d.classList.toggle("on", Math.round(pos) === i + 1));
  dots.style.opacity = pos > 0.5 && pos < SCENES - 1.5 ? 1 : 0;

  // Logo: anticipation squash, big arcing jump with a swirl, squash on landing, then idle float.
  let x, y, sx = 1, sy = 1, rot = 0;
  if (st.slide) {
    const p = st.p, [x0, y0] = REST[st.slide - 1], [x1, y1] = REST[st.slide];
    const pre = 0.16, land = 0.86;
    if (p < pre) { const q = p / pre; x = x0; y = y0 + 10 * Math.sin(q * Math.PI / 2); sx = 1 + .22 * q; sy = 1 - .26 * q; }
    else if (p < land) {
      const q = (p - pre) / (land - pre), e = easeInOut(q);
      x = x0 + (x1 - x0) * e; y = y0 + (y1 - y0) * e - 260 * Math.sin(Math.PI * q);
      sx = 1 - .12 * Math.sin(Math.PI * q); sy = 1 + .16 * Math.sin(Math.PI * q);
      rot = 360 * easeInOut(q) * (st.slide % 2 ? 1 : -1);
    } else { const q = (p - land) / (1 - land); x = x1; y = y1 + 10 * Math.sin(q * Math.PI); sx = 1 + .2 * Math.sin(q * Math.PI); sy = 1 - .22 * Math.sin(q * Math.PI); }
  } else {
    const [x0, y0] = REST[st.scene];
    const since = st.since;
    // Entrance on the intro: drop in with an elastic bounce.
    if (st.scene === 0) {
      const q = clamp(t / 0.9), e = easeOutBack(q);
      x = x0; y = -160 + (y0 + 160) * e; sx = 1 + .06 * Math.sin(q * Math.PI * 3) * (1 - q); sy = 2 - sx;
    } else { x = x0; y = y0; }
    // Idle float plus a small "talking" bob.
    y += -8 * Math.sin(t * 2.4);
    const talk = Math.max(0, Math.sin(t * 13)) * .05 * (since < HOLD - 0.4 ? 1 : 0);
    sy *= 1 + talk; sx *= 1 - talk * .6;
    // Celebration hop when the demo has finished.
    if (st.scene >= 1 && st.scene <= FEATURES.length && since > HOLD - 0.55) {
      const q = clamp((since - (HOLD - 0.55)) / 0.4);
      y -= 34 * Math.sin(Math.PI * q); rot = 8 * Math.sin(Math.PI * 2 * q);
    }
    if (st.scene === SCENES - 1) { const q = clamp(since / 0.6); sx *= 1 + .08 * Math.sin(q * Math.PI); sy = 2 - sx; }
  }
  const logo = document.getElementById("logo");
  logo.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${sx}, ${sy})`;
  logo.style.transformOrigin = "50% 100%";
  const sh = document.getElementById("shadow"), [rx, ry] = st.slide ? REST[st.slide] : REST[st.scene];
  const lift = clamp(((st.slide ? REST[st.slide][1] : REST[st.scene][1]) - y) / 260);
  Object.assign(sh.style, { left: (x + 5) + "px", top: (ry + 112) + "px", opacity: .9 - .7 * lift, transform: `scale(${1 - .5 * lift})` });
  document.getElementById("prog").style.width = (t / DURATION * 1280) + "px";

  // Feature demos: each plays its whole recorded clip during its hold and ends on the result.
  const seeks = [];
  FEATURES.forEach((f, i) => {
    const v = panels[i + 1].querySelector("video"), k = i + 1;
    const start = slideStart(k) + SLIDE * 0.5, end = slideStart(k) + SLIDE + HOLD - 0.6;
    const q = clamp((t - start) / (end - start));
    const visible = Math.abs(pos - k) < 1;
    // Highlight: marker sweep on the feature name, window zoom + glow, "Done" when the result is in.
    const panel = panels[k], h = clamp((t - (slideStart(k) + SLIDE)) / 0.6), win = panel.querySelector(".win");
    panel.querySelector("h2 em").style.setProperty("--hl", (easeInOut(h) * 100).toFixed(1) + "%");
    const z = clamp((t - (slideStart(k) + SLIDE)) / 0.5) * (1 - clamp((t - (end + 0.35)) / 0.3) * 0.4);
    const glow = 0.15 + 0.55 * z;
    win.style.transform = `scale(${1 + 0.035 * easeInOut(z)})`;
    panel.querySelector(".spot").style.opacity = (0.95 * easeInOut(z)).toFixed(2);
    win.style.boxShadow = `0 40px 80px -30px rgba(0,0,0,.55), 0 0 0 ${(2 + 2 * z).toFixed(1)}px rgba(201,162,122,${glow.toFixed(2)}), 0 0 ${(40 * z).toFixed(0)}px rgba(201,162,122,${(0.45 * z).toFixed(2)})`;
    const d = clamp((t - end) / 0.25), done = panel.querySelector(".done");
    done.style.opacity = d; done.style.transform = `scale(${0.6 + 0.4 * easeOutBack(d)})`;
    if (visible && v.duration) {
      const target = Math.min(v.duration - 0.05, q * v.duration);
      if (Math.abs(v.currentTime - target) > 0.001) seeks.push(new Promise((r) => { v.addEventListener("seeked", r, { once: true }); v.currentTime = target; }));
    }
  });
  await Promise.all(seeks);
};
window.ready = Promise.all([document.fonts.ready, ...[...document.querySelectorAll("video")].map((v) => new Promise((r) => v.readyState >= 1 ? r() : v.addEventListener("loadedmetadata", r, { once: true }))),
  new Promise((r) => { const i = document.getElementById("logoimg"); i.complete ? r() : i.onload = r; })]);
</script>
</body>
</html>
