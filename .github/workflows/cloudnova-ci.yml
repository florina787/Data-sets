name: cloudnova-ci
on:
  push:
    paths: ["cloudnova/**", ".github/workflows/cloudnova-ci.yml"]
  pull_request:
    paths: ["cloudnova/**", ".github/workflows/cloudnova-ci.yml"]
jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudnova
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cloudnova/requirements.txt
      - run: pip install -r requirements.txt
      - name: Build cleaned dataset
        run: python -m app build --force
      - name: Unit tests (no LLM)
        run: python -m pytest
      - name: Eval harness (deterministic cases; fails on FAIL or unexpected XPASS)
        env:
          LLM_PROVIDER: none
        run: python -m evals
      - name: Single-command demo smoke test
        env:
          LLM_PROVIDER: none
        run: python -m app demo | tail -20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: cloudnova/evals/results/latest.json
