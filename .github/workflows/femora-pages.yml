name: FEMORA deploy to GitHub Pages

# Deploys FEMORA Muse to GitHub Pages from the florina787/femora repository (manual, owner-approved).
# Manual only: deployments need the owner's approval.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: femora-pages
  cancel-in-progress: false

jobs:
  build:
    # Safety: Data-sets' Pages site belongs to VEENA.AI. FEMORA deploys only from its own repository.
    if: github.repository == 'florina787/femora'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: femora/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: femora/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          FEMORA_BASE: /${{ github.event.repository.name }}/
          FEMORA_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: femora/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
