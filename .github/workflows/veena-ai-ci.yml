name: VEENA.AI CI

on:
  pull_request:
    paths: ["veena-ai/**", ".github/workflows/veena-ai-ci.yml"]
  push:
    paths: ["veena-ai/**", ".github/workflows/veena-ai-ci.yml"]
  workflow_dispatch:
    inputs:
      create_draft_release:
        description: "After all builds and tests pass, create a DRAFT GitHub Release (not public until you publish it)"
        type: boolean
        default: false
      release_channel:
        description: "beta = free public beta (package.json version, billing OFF); rc = monetized release candidate 0.2.0-rc.1 (billing ON)"
        type: choice
        options: [beta, rc]
        default: beta
      require_live_insights:
        description: "Fail the build if the Insights endpoint's /health is not ok (off = record a warning; the app works offline either way)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: veena-ai-${{ github.ref }}
  cancel-in-progress: true

env:
  # Production Insights Worker (feedback + opt-in statistics), verified live by the
  # "VEENA Insights deploy" workflow. A repository variable VEENA_INSIGHTS_URL overrides it.
  VEENA_INSIGHTS_PROD: ${{ vars.VEENA_INSIGHTS_URL || 'https://veena-insights.florinaregius.workers.dev' }}
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veena-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: veena-ai/pyproject.toml
      - name: Install Tesseract (retried; Ubuntu mirrors are occasionally unreachable)
        run: |
          for i in 1 2 3; do
            timeout 300 sh -c 'sudo apt-get update && sudo apt-get install -y tesseract-ocr' && exit 0
            sleep 20
          done
          # Runner DNS outages to Ubuntu mirrors have lasted 25+ minutes; conda-forge is a separate source.
          echo "::warning::Ubuntu mirrors unreachable; installing Tesseract from conda-forge instead"
          curl -fsSL --retry 3 https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xj -C "$RUNNER_TEMP" bin/micromamba
          "$RUNNER_TEMP/bin/micromamba" create -y -q -r "$RUNNER_TEMP/mamba" -p "$RUNNER_TEMP/tess" -c conda-forge tesseract
          "$RUNNER_TEMP/tess/bin/tesseract" --list-langs | grep -qx eng
          echo "$RUNNER_TEMP/tess/bin" >> "$GITHUB_PATH"
      - run: pip install -e ".[dev]"
      - run: ruff check backend tests packaging
      - run: ruff format --check backend tests
      # Deterministic suite: simulated LLM/embedder/ASR, real OCR and Silero VAD.
      # Real-model suites (-m "ollama or asr or embeddings") need local models.
      - run: pytest -m "not ollama and not asr and not embeddings" -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veena-ai/apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: veena-ai/apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  package:
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            exe: release/win-unpacked/VEENA.AI.exe
            backend: packaging/backend-dist/veena-backend/veena-backend.exe
            artifact: release/VEENA.AI-Windows-Setup.exe
            asar: release/win-unpacked/resources/app.asar
          - os: ubuntu-latest
            target: --linux
            exe: release/linux-unpacked/veena-ai
            backend: packaging/backend-dist/veena-backend/veena-backend
            artifact: release/VEENA.AI-Linux-x86_64.AppImage
            asar: release/linux-unpacked/resources/app.asar
          - os: macos-15
            target: --mac
            exe: release/mac-arm64/VEENA.AI.app/Contents/MacOS/VEENA.AI
            backend: packaging/backend-dist/veena-backend/veena-backend
            artifact: release/VEENA.AI-macOS-AppleSilicon.dmg
            asar: release/mac-arm64/VEENA.AI.app/Contents/Resources/app.asar
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: veena-ai/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: veena-ai/apps/desktop/package-lock.json
      - name: Release channel
        shell: bash
        run: |
          if [ "${{ inputs.release_channel }}" = "rc" ]; then
            (cd veena-ai/apps/desktop && npm version 0.2.0-rc.1 --no-git-tag-version --allow-same-version)
            sed -i.bak 's/^__version__ = .*/__version__ = "0.2.0-rc.1"/' veena-ai/backend/__init__.py && rm -f veena-ai/backend/__init__.py.bak
            echo "### Channel: monetized release candidate 0.2.0-rc.1 (billing ON)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Channel: free public beta (billing OFF, no account)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install backend dependencies
        working-directory: veena-ai
        run: pip install -e . pyinstaller==6.22.3
      - name: Diagnose Hugging Face downloads (plain Python, not the packaged app)
        # A first-use model download hung inside the packaged app on Windows (run 42717356914).
        # This isolates whether the same download hangs in plain Python on this runner.
        timeout-minutes: 4
        continue-on-error: true
        working-directory: veena-ai
        run: python -c "import time, filelock, huggingface_hub as h; t=time.time(); p=h.hf_hub_download('Systran/faster-whisper-tiny','config.json', cache_dir='hf-diag'); print('download OK in', round(time.time()-t,1), 's; filelock', filelock.__version__, '; huggingface_hub', h.__version__)"
      - name: Bundle the document-search model (no download on first use)
        working-directory: veena-ai
        run: python packaging/fetch_models.py
      - name: Freeze backend (PyInstaller)
        working-directory: veena-ai
        run: pyinstaller packaging/backend.spec --noconfirm --distpath packaging/backend-dist --workpath packaging/build
      - name: Smoke-test frozen backend
        working-directory: veena-ai
        run: python packaging/smoke_backend.py ${{ matrix.backend }}
      - name: Build desktop app and installer
        working-directory: veena-ai/apps/desktop
        env:
          # Code signing activates only when the owner adds these repository secrets:
          #   Windows: WIN_CSC_LINK (base64 .pfx) + WIN_CSC_KEY_PASSWORD
          #   macOS:   MAC_CSC_LINK (base64 Developer ID .p12) + MAC_CSC_KEY_PASSWORD,
          #            APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID (notarization)
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Billing server baked into the installers (monetized builds). Set the repository variable
          # VEENA_BILLING_URL to the deployed Worker; until then builds point at an unreachable
          # placeholder, so installed apps fail closed (sign-in required, no unlimited use).
          # Free beta (default): empty = billing OFF. Release candidate: the deployed Worker, or an
          # unreachable placeholder so the RC fails closed until the Worker exists.
          VEENA_BILLING_URL: ${{ inputs.release_channel == 'rc' && (vars.VEENA_BILLING_URL || 'https://veena-billing.invalid') || '' }}
          VEENA_INSIGHTS_URL: ${{ env.VEENA_INSIGHTS_PROD }}
        run: |
          node scripts/write-build-config.mjs
          # Each OS uses only its own certificate (electron-builder falls back to CSC_LINK on Windows).
          if [ "$RUNNER_OS" != "macOS" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [ "$RUNNER_OS" != "Windows" ]; then unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; fi
          # Secrets that are not configured arrive as empty strings; electron-builder treats an
          # empty CSC_LINK as a certificate path and fails ("not a file"), so drop empty ones.
          for v in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v:-}" ]; then unset "$v"; fi
          done
          if [ -z "${WIN_CSC_LINK:-}${CSC_LINK:-}" ]; then
            echo "No signing certificate configured for $RUNNER_OS: building an UNSIGNED installer."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm ci
          npm run build
          npx electron-builder ${{ matrix.target }} --publish never
      - name: Installer contents (production Insights endpoint baked in and live, no credentials)
        working-directory: veena-ai/apps/desktop
        run: |
          node scripts/check-installer-contents.mjs "${{ matrix.asar }}" ../../packaging/backend-dist/veena-backend "$VEENA_INSIGHTS_PROD"
          # Release builds (manual runs) must point at an endpoint that is actually up with a complete schema.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            curl -sS --retry 3 "$VEENA_INSIGHTS_PROD/health" > /tmp/health.json 2>&1 || true; cat /tmp/health.json; echo
            if ! grep -q '"ok":true' /tmp/health.json; then
              if [ "${{ inputs.require_live_insights }}" = "true" ]; then echo "::error::Insights endpoint $VEENA_INSIGHTS_PROD is not healthy"; exit 1; fi
              echo "::warning::Insights endpoint $VEENA_INSIGHTS_PROD is not live yet. Feedback/statistics will start working once it is deployed; local AI features do not depend on it."
              echo "### WARNING: Insights endpoint not live at build time (opt-in statistics queue and retry; app works offline)" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "### Insights endpoint in this installer: $VEENA_INSIGHTS_PROD" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke-test packaged app (Linux)
        if: runner.os == 'Linux'
        working-directory: veena-ai/apps/desktop
        run: xvfb-run -a node scripts/smoke-packaged.mjs "${{ matrix.exe }}"
      - name: Smoke-test packaged app (Windows, macOS)
        if: runner.os != 'Linux'
        working-directory: veena-ai/apps/desktop
        run: node scripts/smoke-packaged.mjs "${{ matrix.exe }}"
      - name: Report installer signature status
        working-directory: veena-ai/apps/desktop
        run: |
          case "$RUNNER_OS" in
            Windows) powershell -NoProfile -Command "(Get-AuthenticodeSignature '${{ matrix.artifact }}').Status" | tee signature.txt ;;
            macOS) (codesign -dv --verbose=2 "${{ matrix.exe }}" 2>&1 | grep -E "Authority|Signature" || echo "unsigned") | tee signature.txt
                   (xcrun stapler validate "${{ matrix.artifact }}" 2>&1 || true) | tail -1 | tee -a signature.txt ;;
            Linux) echo "AppImage: integrity via SHA-256 (no OS signing scheme)" | tee signature.txt ;;
          esac
          echo "### Signature ($RUNNER_OS): $(head -1 signature.txt)" >> "$GITHUB_STEP_SUMMARY"

      # ---- Customer path: install the real installer, launch the installed app, first-run AI, uninstall ----
      - name: Install with the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: veena-ai/apps/desktop
        run: |
          $p = Start-Process -FilePath "release\VEENA.AI-Windows-Setup.exe" -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "VEENA.AI.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "installed VEENA.AI.exe not found under $env:LOCALAPPDATA\Programs" }
          $dir = $exe.DirectoryName
          $start = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "VEENA.AI*.lnk"
          if (-not $start) { throw "Start menu shortcut missing" }
          $desktop = Join-Path ([Environment]::GetFolderPath("Desktop")) "VEENA.AI.lnk"
          if (-not (Test-Path $desktop)) { throw "desktop shortcut missing: $desktop" }
          "INSTALLED_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          "INSTALLED_DIR=$dir" >> $env:GITHUB_ENV
          "INSTALLED_BACKEND=$dir\resources\backend\veena-backend.exe" >> $env:GITHUB_ENV
          "### Windows installer: installed to $dir; Start menu and desktop shortcuts created" >> $env:GITHUB_STEP_SUMMARY
      - name: Install from the macOS disk image
        if: runner.os == 'macOS'
        working-directory: veena-ai/apps/desktop
        run: |
          hdiutil attach "${{ matrix.artifact }}" -nobrowse -mountpoint /Volumes/veena
          cp -R /Volumes/veena/VEENA.AI.app /Applications/
          hdiutil detach /Volumes/veena
          echo "INSTALLED_EXE=/Applications/VEENA.AI.app/Contents/MacOS/VEENA.AI" >> "$GITHUB_ENV"
          echo "INSTALLED_BACKEND=/Applications/VEENA.AI.app/Contents/Resources/backend/veena-backend" >> "$GITHUB_ENV"
          echo "### macOS disk image: VEENA.AI.app copied to /Applications" >> "$GITHUB_STEP_SUMMARY"
      - name: Unpack the Linux AppImage
        if: runner.os == 'Linux'
        working-directory: veena-ai/apps/desktop
        run: |
          chmod +x "${{ matrix.artifact }}"
          mkdir -p /tmp/appimage && cd /tmp/appimage && "$GITHUB_WORKSPACE/veena-ai/apps/desktop/${{ matrix.artifact }}" --appimage-extract >/dev/null
          echo "INSTALLED_EXE=/tmp/appimage/squashfs-root/veena-ai" >> "$GITHUB_ENV"
          echo "INSTALLED_BACKEND=/tmp/appimage/squashfs-root/resources/backend/veena-backend" >> "$GITHUB_ENV"
      - name: Launch the installed app
        working-directory: veena-ai/apps/desktop
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a node scripts/smoke-packaged.mjs "$INSTALLED_EXE"; else node scripts/smoke-packaged.mjs "$INSTALLED_EXE"; fi
      - name: First run on a machine without Ollama (real runtime download, real model answer)
        working-directory: veena-ai
        timeout-minutes: 45
        run: |
          # Real billing Worker (test server, Stripe simulator) on this machine: proves the INSTALLED
          # app gives 3 free answers, refuses the 4th, and unlocks after a confirmed purchase.
          # Real Insights Worker (test server) on this machine: opt-in statistics from the INSTALLED app
          # must reach the dashboard summary and be deleted on withdrawal.
          node --no-warnings cloud/insights/test/serve.mjs 8788 > insights-server.log 2>&1 &
          extra="--insights-url http://127.0.0.1:8788"
          if [ "${{ inputs.release_channel }}" = "rc" ]; then
            # Real billing Worker (test server): 3 free answers, 4th refused, purchase unlocks.
            node --no-warnings cloud/billing/test/serve.mjs 8787 > billing-server.log 2>&1 &
            for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/v1/prices >/dev/null && break; sleep 1; done
            extra="$extra --billing-url http://127.0.0.1:8787"
          fi
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8788/ && break; sleep 1; done
          python packaging/smoke_runtime.py "$INSTALLED_BACKEND" --model qwen2.5:0.5b --out "runtime-smoke-${RUNNER_OS}.json" $extra
          python -c "import json,sys; d=json.load(open(sys.argv[1])); print('### First run:', 'PASS' if d['passed'] else 'FAIL', json.dumps(d.get('steps')))" "runtime-smoke-${RUNNER_OS}.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $un = Get-ChildItem $env:INSTALLED_DIR -Filter "Uninstall*.exe" | Select-Object -First 1
          if (-not $un) { throw "uninstaller not found" }
          Start-Process -FilePath $un.FullName -ArgumentList "/S" -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $env:INSTALLED_EXE); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $env:INSTALLED_EXE) { throw "VEENA.AI.exe still present after uninstall" }
          "### Windows uninstaller removed the app" >> $env:GITHUB_STEP_SUMMARY
      - name: Uninstall (macOS)
        if: runner.os == 'macOS'
        run: rm -rf /Applications/VEENA.AI.app && test ! -e /Applications/VEENA.AI.app

      - name: Checksum
        working-directory: veena-ai/apps/desktop
        run: |
          cd release && f="$(basename "${{ matrix.artifact }}")"
          if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
          cat "$f.sha256" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: veena-ai-${{ runner.os }}
          path: |
            veena-ai/apps/desktop/${{ matrix.artifact }}
            veena-ai/apps/desktop/${{ matrix.artifact }}.sha256
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-run-evidence-${{ runner.os }}
          path: |
            veena-ai/runtime-smoke-*.json
            veena-ai/apps/desktop/signature.txt
          retention-days: 30
          if-no-files-found: ignore

  # Dependency vulnerabilities, software bill of materials and licence inventory.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: veena-ai/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: veena-ai/apps/desktop/package-lock.json
      - name: Python dependencies (the app's environment only)
        working-directory: veena-ai
        run: pip install -e .
      - name: Security tools in a separate environment (so they cannot change what is audited)
        run: |
          python -m venv /tmp/sectools
          /tmp/sectools/bin/pip install --quiet pip-audit==2.9.0 cyclonedx-bom==7.2.1 pip-licenses==5.0.0
      - name: Python vulnerability audit
        working-directory: veena-ai
        run: |
          pip freeze --exclude-editable | grep -v "^-e" > installed.txt
          /tmp/sectools/bin/pip-audit -r installed.txt --no-deps --disable-pip --progress-spinner off
      - name: npm vulnerability audit (shipped dependencies)
        working-directory: veena-ai/apps/desktop
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Software bill of materials (CycloneDX)
        run: |
          cd veena-ai && /tmp/sectools/bin/cyclonedx-py environment "$(python -c 'import sys; print(sys.executable)')" -o ../sbom-python.cdx.json
          cd apps/desktop && npx --yes @cyclonedx/cyclonedx-npm@4.0.0 --omit dev --output-file ../../../sbom-npm.cdx.json
      - name: Licence inventory
        working-directory: veena-ai
        run: |
          /tmp/sectools/bin/pip-licenses --python "$(python -c 'import sys; print(sys.executable)')" --format=markdown --with-urls > ../licenses-python.md
          python -c "import backend.models.profiles as p; bad=[m for m,v in p.PROFILES.items() for k in ('text_model','vision_model') if not (p.license_of(v[k]) or {}).get('commercial')]; print('profiles with non-commercial default models:', bad); raise SystemExit(1 if bad else 0)"
      - uses: actions/upload-artifact@v4
        with:
          name: veena-ai-sbom-and-licences
          path: |
            sbom-python.cdx.json
            sbom-npm.cdx.json
            licenses-python.md
          retention-days: 30

  # Downloadable release files from a manual beta run: one ZIP-able package plus one artifact per
  # installer. Every file is checked (exists, non-empty, real installer format) before upload.
  release-package:
    needs: [package, security]
    if: github.event_name == 'workflow_dispatch' && inputs.release_channel == 'beta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: veena-ai-*
          path: dist
          merge-multiple: true
      - name: Verify installers and assemble the package
        run: |
          set -euo pipefail
          version=$(node -p "require('./veena-ai/apps/desktop/package.json').version")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir pkg
          win=VEENA.AI-Windows-Setup.exe mac=VEENA.AI-macOS-AppleSilicon.dmg lin=VEENA.AI-Linux-x86_64.AppImage
          for f in $win $mac $lin; do test -s "dist/$f" || { echo "::error::$f missing or empty"; exit 1; }; cp "dist/$f" pkg/; done
          # Real formats, not renamed archives: PE executable, ELF AppImage (type-2 magic), UDIF disk image ("koly" trailer).
          [ "$(head -c 2 pkg/$win)" = "MZ" ] || { echo "::error::$win is not a Windows executable"; exit 1; }
          [ "$(head -c 4 pkg/$lin | tail -c 3)" = "ELF" ] && [ "$(dd if=pkg/$lin bs=1 skip=8 count=3 2>/dev/null | od -An -tx1 | tr -d ' ')" = "414902" ] || { echo "::error::$lin is not a type-2 AppImage"; exit 1; }
          [ "$(tail -c 512 pkg/$mac | head -c 4)" = "koly" ] || { echo "::error::$mac is not a macOS disk image"; exit 1; }
          # Each installer must match the checksum its own build job recorded.
          for f in $win $mac $lin; do [ "$(cut -d' ' -f1 dist/$f.sha256)" = "$(sha256sum pkg/$f | cut -d' ' -f1)" ] || { echo "::error::$f checksum changed after build"; exit 1; }; done
          (cd pkg && sha256sum $win $mac $lin > SHA256SUMS && sha256sum -c SHA256SUMS)
          cp veena-ai/packaging/RELEASE_NOTES.md veena-ai/packaging/INSTALLATION.md veena-ai/packaging/KNOWN_LIMITATIONS.md pkg/
          { echo "### VEENA.AI $version release files (commit \`${GITHUB_SHA::7}\`)"; echo '| File | Bytes | Type |'; echo '|---|---|---|'
            for f in pkg/*; do echo "| $(basename "$f") | $(stat -c %s "$f") | $(file -b "$f" | cut -c1-60) |"; done
            echo; echo '```'; cat pkg/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: VEENA-AI-${{ env.VERSION }}-RELEASE-PACKAGE
          path: pkg/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: VEENA-AI-${{ env.VERSION }}-Windows-Setup.exe
          path: pkg/VEENA.AI-Windows-Setup.exe
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: VEENA-AI-${{ env.VERSION }}-macOS-AppleSilicon.dmg
          path: pkg/VEENA.AI-macOS-AppleSilicon.dmg
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: VEENA-AI-${{ env.VERSION }}-Linux-x86_64.AppImage
          path: pkg/VEENA.AI-Linux-x86_64.AppImage
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: VEENA-AI-${{ env.VERSION }}-SHA256SUMS-and-docs
          path: |
            pkg/SHA256SUMS
            pkg/RELEASE_NOTES.md
            pkg/INSTALLATION.md
            pkg/KNOWN_LIMITATIONS.md
          retention-days: 30

  # Creates a DRAFT GitHub Release from a manual run only. A draft is not public:
  # the owner reviews it on GitHub and presses "Publish release" themselves.
  # Protect it further with Settings > Environments > release > Required reviewers.
  draft-release:
    needs: [package, security]
    if: github.event_name == 'workflow_dispatch' && inputs.create_draft_release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: veena-ai-*
          path: dist
          merge-multiple: true
      - name: Create draft release (never overwrites a published one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./veena-ai/apps/desktop/package.json').version")
          # The rc channel builds 0.2.0-rc.1: its files must never land in the free beta's draft.
          if [ "${{ inputs.release_channel }}" = "rc" ]; then version="0.2.0-rc.1"; fi
          tag="veena-ai-v$version"
          title="VEENA.AI v$version"; case "$version" in *-*) ;; *) title="VEENA.AI v$version — Free Public Beta" ;; esac
          if gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null | grep -q false; then
            echo "Release $tag is already published. Bump the version in package.json; published releases are never overwritten." >&2
            exit 1
          fi
          cd dist
          files="VEENA.AI-Windows-Setup.exe VEENA.AI-macOS-AppleSilicon.dmg VEENA.AI-Linux-x86_64.AppImage"
          for f in $files; do test -s "$f"; done
          sha256sum $files > SHA256SUMS
          cd ..
          notes_src=veena-ai/packaging/RELEASE_NOTES.md; case "$version" in *-*) notes_src=veena-ai/packaging/RELEASE_NOTES_MONETIZED_RC.md ;; esac
          { cat "$notes_src"; echo; echo "Built from commit \`${GITHUB_SHA::7}\` by [this CI run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."; echo; echo '```'; cat dist/SHA256SUMS; echo '```'; } > notes.md
          cp veena-ai/packaging/INSTALLATION.md veena-ai/packaging/KNOWN_LIMITATIONS.md dist/
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/VEENA.AI-* dist/SHA256SUMS dist/INSTALLATION.md dist/KNOWN_LIMITATIONS.md dist/*.cdx.json --clobber
            gh release delete-asset "$tag" SHA256SUMS.txt -y 2>/dev/null || true   # renamed to SHA256SUMS
            gh release edit "$tag" --notes-file notes.md --draft --target "$GITHUB_SHA" --title "$title"
          else
            pre=""; case "$version" in *-*) pre="--prerelease" ;; esac   # release candidates are pre-releases
            gh release create "$tag" --draft $pre --target "$GITHUB_SHA" --title "$title" --notes-file notes.md \
              dist/VEENA.AI-Windows-Setup.exe dist/VEENA.AI-macOS-AppleSilicon.dmg dist/VEENA.AI-Linux-x86_64.AppImage dist/SHA256SUMS dist/INSTALLATION.md dist/KNOWN_LIMITATIONS.md
          fi
          echo "### Draft release $tag created. Review it on GitHub, then publish manually." >> "$GITHUB_STEP_SUMMARY"

