name: VEENA.AI website

# Builds and checks the static website on every change. Deploys to GitHub Pages
# (free, HTTPS, https://florina787.github.io/Data-sets/) ONLY when the owner runs
# this workflow by hand with "deploy" ticked. Before the first deploy the owner
# enables Pages once: Settings > Pages > Source: GitHub Actions.
# Rollback: run this workflow again on an earlier commit (Actions > Run workflow > branch/tag).

on:
  push:
    paths: ["veena-ai/site/**", "veena-ai/docs/images/**", ".github/workflows/veena-ai-site.yml"]
  pull_request:
    paths: ["veena-ai/site/**", ".github/workflows/veena-ai-site.yml"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish the website to GitHub Pages (public)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: veena-ai-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and check links
        env:
          REF: ${{ github.ref_name }}
        run: veena-ai/site/build.sh "$GITHUB_WORKSPACE/_site"
      - name: Check the page works on a phone and has no broken downloads
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 -d _site >/dev/null 2>&1 &
          sleep 1
          node - <<'JS'
          const { chromium } = require("playwright");
          (async () => {
            const b = await chromium.launch();
            for (const vp of [{ width: 390, height: 844 }, { width: 1366, height: 900 }]) {
              const p = await b.newPage({ viewport: vp });
              await p.goto("http://127.0.0.1:8765/index.html");
              await p.waitForTimeout(4000);
              if (await p.evaluate(() => document.documentElement.scrollWidth > window.innerWidth)) throw new Error(`horizontal scroll at ${vp.width}px`);
              // An enabled download button must point at a real file.
              for (const href of await p.$$eval("#downloads .btn[href]", (bs) => bs.map((x) => x.href))) {
                const r = await fetch(href, { method: "HEAD", redirect: "follow" });
                if (!r.ok) throw new Error(`download link broken: ${href} -> ${r.status}`);
                console.log("download OK:", href);
              }
            }
            await b.close();
          })().catch((e) => { console.error(e); process.exit(1); });
          JS
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the live site
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$url" | grep -q "Your intelligent conversation companion"; then echo "live: $url"; exit 0; fi
            sleep 10
          done
          echo "site did not come up at $url" >&2; exit 1
