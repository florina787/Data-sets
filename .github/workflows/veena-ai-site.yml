name: VEENA.AI website

# Builds and checks the static website on every change. Deploys to GitHub Pages
# (free, HTTPS, https://florina787.github.io/Data-sets/) ONLY when the owner runs
# this workflow by hand with "deploy" ticked. Before the first deploy the owner
# enables Pages once: Settings > Pages > Source: GitHub Actions.
# Rollback: run this workflow again on an earlier commit (Actions > Run workflow > branch/tag).

on:
  push:
    paths: ["veena-ai/site/**", "veena-ai/apps/desktop/assets/**", ".github/workflows/veena-ai-site.yml"]
  pull_request:
    paths: ["veena-ai/site/**", ".github/workflows/veena-ai-site.yml"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish the website to GitHub Pages (public)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: veena-ai-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and check links
        env:
          REF: ${{ github.ref_name }}
        run: veena-ai/site/build.sh "$GITHUB_WORKSPACE/_site"
      - name: Browser checks (phone, tablet, desktop; accessibility; downloads; feedback form)
        run: |
          mkdir -p /tmp/sitecheck /tmp/screens && cd /tmp/sitecheck
          npm init -y >/dev/null
          npm install --no-save playwright@1.63.0 axe-core@4.11.0
          npx playwright install --with-deps chromium
          node "$GITHUB_WORKSPACE/veena-ai/site/tools/site_check.mjs" "$GITHUB_WORKSPACE/_site" /tmp/screens
      - name: Release download totals (GitHub's own per-file counts)
        run: python3 veena-ai/site/tools/release_downloads.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-screenshots
          path: /tmp/screens
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the live site
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$url" | grep -q "Meet <span class=\"serif\">VEENA.</span>"; then echo "live: $url"; exit 0; fi
            sleep 10
          done
          echo "site did not come up at $url" >&2; exit 1
