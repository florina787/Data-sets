services:
  api:
    build: .
    image: archai-enterprise-advisor:latest
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      DEMO_MODE: ${DEMO_MODE:-true}
      # Only used when DEMO_MODE=false. Supplied from YOUR shell/.env — never baked into the image.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

  ui:
    image: archai-enterprise-advisor:latest
    depends_on:
      - api
    command: ["streamlit", "run", "frontend/streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      DEMO_MODE: ${DEMO_MODE:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    healthcheck:
      disable: true
