# One-command start:  docker compose up --build      → UI http://localhost:8080 , API http://localhost:8000/docs
# No paid credentials are needed. Language generation is deterministic unless LLM_MODE=live and a key is set.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: beauty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beauty-demo-only}
      POSTGRES_DB: beauty
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beauty"]
      interval: 5s
      retries: 20
  backend:
    build: { context: ., dockerfile: backend/Dockerfile, secrets: [extra_ca] }
    env_file: [.env.example]
    environment:
      DATABASE_URL: postgresql+psycopg://beauty:${POSTGRES_PASSWORD:-beauty-demo-only}@db:5432/beauty
      DATA_DIR: /app/data
      POLICY_DIR: /app/policies
      EVAL_CONFIG_DIR: /app/evaluation/configs
      STORAGE_DIR: /app/var/storage
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
  frontend:
    build: { context: ./frontend, secrets: [extra_ca] }
    ports: ["8080:8080"]
    depends_on: { backend: { condition: service_healthy } }
volumes:
  pgdata:
secrets:
  # Optional extra CA for builds behind a TLS-intercepting proxy: EXTRA_CA_FILE=/path/ca.pem docker compose build
  extra_ca:
    file: ${EXTRA_CA_FILE:-./.no-extra-ca}
