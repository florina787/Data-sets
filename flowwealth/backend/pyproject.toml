[project]
name = "flowwealth-backend"
version = "4.0.0a1"
description = "FLOW WEALTH v4 - point-in-time financial research, prediction memory and independent risk engine"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "duckdb>=1.1",
  "pydantic>=2.7,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:The inplace keyword:DeprecationWarning", "ignore::pandas.errors.Pandas4Warning"]

[tool.uv]
package = false
