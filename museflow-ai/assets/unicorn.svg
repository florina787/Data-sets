<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="lumiTitle">
  <title id="lumiTitle">Lumi, the MuseFlow AI unicorn</title>
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE1EF" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#DCC8FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#C9E8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#D9A5A0"/>
      <stop offset="55%" stop-color="#FFF0D5"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="mane1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7B7D2"/>
      <stop offset="100%" stop-color="#B79CED"/>
    </linearGradient>
    <linearGradient id="mane2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9E8FF"/>
      <stop offset="100%" stop-color="#DCC8FF"/>
    </linearGradient>
    <linearGradient id="mane3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8F7E5"/>
      <stop offset="100%" stop-color="#F7B7D2"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF0F7"/>
    </linearGradient>
  </defs>
  <circle cx="122" cy="122" r="112" fill="url(#halo)"/>
  <!-- horn -->
  <path d="M128 78 L170 16 L148 84 Z" fill="url(#horn)" stroke="#D9A5A0" stroke-width="2" stroke-linejoin="round"/>
  <path d="M138 70 L152 74 M145 58 L158 62 M152 46 L163 49 M158 34 L166 37" stroke="#D9A5A0" stroke-width="2" stroke-linecap="round"/>
  <!-- head & neck -->
  <path d="M74 220 C62 172 64 132 82 106 C97 84 121 72 146 74 C171 76 189 92 197 114 C203 130 201 144 191 152 C181 160 166 158 151 152 C141 149 133 152 129 162 C123 180 126 200 133 220 Z"
