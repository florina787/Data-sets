apiVersion: v1
kind: Service
metadata:
  name: foodcare-copilot
  labels:
    app.kubernetes.io/component: api
spec:
  type: ClusterIP           # expose through the cluster's own ingress / gateway, not a public LB
  selector:
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
