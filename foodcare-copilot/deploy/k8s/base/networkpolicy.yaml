apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: foodcare-copilot
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:   # ingress controller and the monitoring stack only (adjust namespace labels to the cluster)
        - namespaceSelector:
            matchLabels:
              foodcare.io/allow-ingress: "true"
        - namespaceSelector:
            matchLabels:
              foodcare.io/monitoring: "true"
      ports:
        - port: 8700
  egress:
    - to:     # DNS
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:     # the existing local-model namespace; no other outbound traffic (no cloud AI APIs)
        - namespaceSelector:
            matchLabels:
              foodcare.io/llm-server: "true"
