# Azure Kubernetes Service
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: {kind: PersistentVolumeClaim, name: foodcare-data}
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: managed-csi         # Azure Disk CSI
