# Flux GitOps example: Flux reconciles the GKE overlay from this repository.
# Swap path to ./foodcare-copilot/deploy/k8s/overlays/aks for Azure.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: foodcare-copilot
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/OWNER/REPO
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: foodcare-copilot
  namespace: flux-system
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: foodcare-copilot
  path: ./foodcare-copilot/deploy/k8s/overlays/gke
  targetNamespace: foodcare
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: foodcare-copilot
      namespace: foodcare
