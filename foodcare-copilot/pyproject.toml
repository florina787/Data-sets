[project]
name = "foodcare-copilot"
version = "0.1.0"
description = "FoodCare Enterprise Copilot - agentic delivery copilot and FreshSip demo storefront (portfolio prototype, synthetic data)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.118.0",
    "uvicorn==0.37.0",
    "pydantic==2.11.9",
    "httpx==0.28.1",
    "langgraph==1.0.1",
    "langgraph-checkpoint-sqlite==2.0.11",
    "tzdata==2025.2",
    "pytest==8.4.2",
    "ruff==0.13.3",
    "pillow==11.3.0",
    "numpy==2.3.3",
    "psutil==7.1.0",
    "torch==2.8.0",
    "torchvision==0.23.0",
]

[tool.uv]
package = false

# CPU-only PyTorch wheels on Linux (no multi-GB CUDA libraries); macOS uses the default PyPI wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 120
extend-exclude = ["fixtures/storefront", "var", "apps"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008"]  # FastAPI dependency-injection idiom

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
markers = ["slow: tests that start real processes"]
filterwarnings = ["ignore::DeprecationWarning:langgraph.*", "ignore:.*allowed_objects.*"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-local-folder = ["conftest"]
