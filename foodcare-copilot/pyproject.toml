[project]
name = "foodcare-copilot"
version = "0.1.0"
description = "FoodCare Enterprise Copilot - agentic delivery copilot and FreshSip demo storefront (portfolio prototype, synthetic data)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.118.0",
    "uvicorn==0.37.0",
    "pydantic==2.11.9",
    "httpx==0.28.1",
    "langgraph==1.0.1",
    "langgraph-checkpoint-sqlite==2.0.11",
    "anthropic==1.12.1",
    "tzdata==2025.2",
    "pytest==8.4.2",
    "ruff==0.13.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
extend-exclude = ["fixtures/storefront", "var", "apps"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008"]  # FastAPI dependency-injection idiom

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
markers = ["slow: tests that start real processes"]
filterwarnings = ["ignore::DeprecationWarning:langgraph.*", "ignore:.*allowed_objects.*"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-local-folder = ["conftest"]
