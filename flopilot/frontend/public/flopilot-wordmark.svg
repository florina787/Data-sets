<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 112" role="img" aria-label="FloPilot — Florina’s Excel Copilot">
  <svg x="0" y="2" width="82" height="106" viewBox="0 0 120 156">
  
  <defs>
    <linearGradient id="wm-skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B5E35A"/>
      <stop offset="1" stop-color="#6DB33F"/>
    </linearGradient>
    <radialGradient id="wm-metal" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#F4F6F8"/>
      <stop offset="0.55" stop-color="#C3C9D1"/>
      <stop offset="1" stop-color="#8A929C"/>
    </radialGradient>
    <clipPath id="wm-body"><rect x="24" y="14" width="72" height="122" rx="36"/></clipPath>
  </defs>
  <!-- hair sprouts -->
  <g stroke="#26352B" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M56 15 C54 8 50 5 47 4"/><path d="M60 14 C60 7 61 4 63 2"/><path d="M64 15 C67 9 71 7 74 7"/>
  </g>
  <!-- arms -->
  <path d="M26 92 C14 98 12 110 18 118" stroke="#6DB33F" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M94 92 C106 98 108 110 102 118" stroke="#6DB33F" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="18" cy="119" r="5.5" fill="#26352B"/><circle cx="102" cy="119" r="5.5" fill="#26352B"/>
  <!-- feet -->
  <ellipse cx="47" cy="146" rx="12" ry="6" fill="#26352B"/><ellipse cx="73" cy="146" rx="12" ry="6" fill="#26352B"/>
  <rect x="42" y="132" width="10" height="12" fill="#0B4F35"/><rect x="68" y="132" width="10" height="12" fill="#0B4F35"/>
  <!-- body -->
  <rect x="24" y="14" width="72" height="122" rx="36" fill="url(#wm-skin)"/>
  <ellipse cx="44" cy="36" rx="10" ry="14" fill="#FFFFFF" opacity="0.18"/>
  <!-- overalls -->
  <g clip-path="url(#wm-body)">
    <path d="M18 104 H102 V140 H18 Z" fill="#0B4F35"/>
    <rect x="40" y="88" width="40" height="22" rx="4" fill="#0B4F35"/>
    <path d="M40 92 L26 80" stroke="#0B4F35" stroke-width="5" stroke-linecap="round"/>
    <path d="M80 92 L94 80" stroke="#0B4F35" stroke-width="5" stroke-linecap="round"/>
    <circle cx="43" cy="92" r="2.2" fill="#C3C9D1"/><circle cx="77" cy="92" r="2.2" fill="#C3C9D1"/>
    <path d="M60 112 V136" stroke="#107C41" stroke-width="1.5"/>
  </g>
  <!-- chart emblem on the bib -->
  <rect x="51" y="93" width="18" height="14" rx="2.5" fill="#FFFFFF"/>
  <rect x="54" y="101" width="3" height="4" fill="#107C41"/><rect x="58.5" y="98" width="3" height="7" fill="#107C41"/><rect x="63" y="95.5" width="3" height="9.5" fill="#107C41"/>
  <!-- goggle strap -->
  <rect x="22" y="47" width="76" height="11" fill="#26352B"/>
  <!-- goggles -->
  <g>
    <circle cx="46" cy="53" r="15" fill="url(#wm-metal)"/><circle cx="74" cy="53" r="15" fill="url(#wm-metal)"/>
    <circle cx="46" cy="53" r="10.5" fill="#FFFFFF"/><circle cx="74" cy="53" r="10.5" fill="#FFFFFF"/>
    <circle cx="47.5" cy="54" r="5" fill="#7A5230"/><circle cx="72.5" cy="54" r="5" fill="#7A5230"/>
    <circle cx="47.5" cy="54" r="2.6" fill="#111827"/><circle cx="72.5" cy="54" r="2.6" fill="#111827"/>
    <circle cx="45.8" cy="52.2" r="1.2" fill="#FFFFFF"/><circle cx="70.8" cy="52.2" r="1.2" fill="#FFFFFF"/>
    <g class="flomin-lids" style="display:none" fill="#8CC84B">
      <rect x="35" y="42" width="22" height="22" rx="11"/><rect x="63" y="42" width="22" height="22" rx="11"/>
    </g>
  </g>
  <!-- smile -->
  <path d="M49 76 Q60 87 71 76 Q60 83 49 76 Z" fill="#5A2E1B"/>
  <path d="M49 76 Q60 87 71 76" stroke="#3B2414" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
  <text x="98" y="64" font-family="Aptos, 'Segoe UI', Calibri, Arial, sans-serif" font-size="54" font-weight="800" fill="#0B4F35" letter-spacing="-1">FloPilot</text>
  <text x="100" y="94" font-family="Aptos, 'Segoe UI', Calibri, Arial, sans-serif" font-size="20" fill="#374151">Florina’s Excel Copilot</text>
</svg>
