[project]
name = "convolens-backend"
version = "0.1.0"
description = "ConvoLens AI - customer conversation intelligence backend (FastAPI + LangGraph)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "langchain-core>=1.0,<2",
  "langchain-anthropic>=1.0,<2",
  "langchain-aws>=1.0,<2",
  "langsmith>=0.4,<1",
  "faiss-cpu>=1.9,<2",
  "numpy>=1.26",
  "kagglehub>=0.3",
  "lingua-language-detector>=2.0,<3",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
