server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 650m;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;            # Flo streams Server-Sent Events
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri /index.html;
  }
}
