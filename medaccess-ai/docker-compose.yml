# Local prototype stack. Synthetic data only - no real patient data, no paid services.
#   docker compose up --build                       # app: http://localhost:8080
#   docker compose --profile monitoring up --build  # + Prometheus :9090, Grafana :3001
name: medaccess-ai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medaccess
      POSTGRES_USER: medaccess
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medaccess-local-only}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medaccess -d medaccess"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      # Values are read from the shell or a local .env file (git-ignored); see .env.example.
      ENVIRONMENT: ${ENVIRONMENT:-demo}
      JWT_SECRET: ${JWT_SECRET:-}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      DATABASE_URL: postgresql+psycopg://medaccess:${POSTGRES_PASSWORD:-medaccess-local-only}@postgres:5432/medaccess
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:8080
    volumes: [runtime:/srv/data/runtime]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8000:8000"]

  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    depends_on:
      backend: { condition: service_healthy }
    ports: ["8080:8080"]

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [monitoring]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    depends_on: [backend]

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-locally}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
  runtime:
