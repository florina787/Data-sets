[pytest]
pythonpath = backend
testpaths = tests
addopts = -q --strict-markers -p no:cacheprovider
markers =
    integration: API / database integration tests
    agents: LangGraph workflow tests
    security: security, privacy, authorization and prompt-injection tests
    performance: latency / throughput smoke tests
    regression: regression tests for previously fixed defects
filterwarnings =
    ignore::DeprecationWarning
