image:
  api: registry.example.com/flo/api
  ui: registry.example.com/flo/ui
  tag: "1.0.0"
api: { replicas: 3, minReplicas: 3, maxReplicas: 20, cpu: 500m, memory: 768Mi }
worker: { replicas: 2, maxReplicas: 10 }
ui: { replicas: 2, dnsResolver: "10.96.0.10" }
config:
  env: production
  modelProvider: mock          # bedrock requires workload identity + region allowed by policy (ca-central-1)
  maxConcurrentWorkflows: 32
existingSecret: flo-secrets    # FLO_DATABASE_URL, FLO_AUDIT_DATABASE_URL, FLO_REDIS_URL, FLO_JWT_SECRET, FLO_VAULT_KEY, LANGSMITH_API_KEY
opa: { image: openpolicyagent/opa:1.4.2-static }
ingress: { enabled: false, host: flo.example.com, className: nginx }
