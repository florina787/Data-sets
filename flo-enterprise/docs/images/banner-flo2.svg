    <rect x="320" width="320" height="64" rx="16" fill="#1b2140" stroke="#5B67F1" stroke-opacity="0.6"/><text x="340" y="40" font-size="18" fill="#ECF0F6">“What if <tspan fill="#E2C766">that sector</tspan> falls 15%?”</text>
