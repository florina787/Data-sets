  <text x="96" y="286" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#94A3B8" letter-spacing="5">INVESTMENT INTELLIGENCE</text>
  <text x="96" y="346" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#ECF0F6">The conversation is the product. <tspan fill="#E2C766">The charts, agents and governance are its intelligence.</tspan></text>
